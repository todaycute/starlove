<html lang="ko">
<head>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#1d2b1f;font-family:'Gowun Dodum',sans-serif;color:#4a2f22;user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none}
button{font-family:inherit;cursor:pointer;color:inherit}
input{user-select:text;-webkit-user-select:text}
canvas#game{position:fixed;inset:0;display:block;image-rendering:pixelated}
.hidden{display:none!important}
.panel{background:#fff6e2;border:3px solid #8a5a3a;border-radius:12px;box-shadow:0 4px 0 #5e3a22,inset 0 0 0 2px #f3d9a8}
.btn{font-family:'Jua',sans-serif;font-size:15px;padding:8px 14px;border-radius:10px;border:2px solid #8a5a3a;background:#ffd98a;color:#4a2f22;box-shadow:0 3px 0 #8a5a3a;white-space:nowrap}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #8a5a3a}
.btn:disabled{opacity:.45;transform:none}
.btn.pink{background:#ffb8c6;border-color:#b8566c;box-shadow:0 3px 0 #b8566c}
.btn.green{background:#bfe6a0}
.btn.big{font-size:20px;padding:12px 26px}
.btn.on{background:#ffb8c6;border-color:#b8566c;box-shadow:0 3px 0 #b8566c}
#hud{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 8px) calc(env(safe-area-inset-right) + 8px) 0 calc(env(safe-area-inset-left) + 8px);display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:5;gap:8px}
#clock{padding:6px 12px 7px;font-family:'Jua',sans-serif;font-size:14px;line-height:1.3;pointer-events:auto;min-width:128px}
#clock .t{font-size:21px;color:#c0563a}
#clock .g{color:#9a6a12}
#relText{color:#c24d72;font-size:13px;white-space:pre-line}
#topBtns{display:flex;gap:6px;pointer-events:auto;flex-wrap:wrap;justify-content:flex-end}
.iconBtn{width:46px;height:46px;font-size:21px;border-radius:12px;background:#fff6e2;border:3px solid #8a5a3a;box-shadow:0 3px 0 #5e3a22;display:flex;align-items:center;justify-content:center}
.iconBtn:active{transform:translateY(2px);box-shadow:0 1px 0 #5e3a22}
#touch{position:fixed;inset:0;pointer-events:none;z-index:6}
#joy{position:absolute;left:calc(env(safe-area-inset-left) + 22px);bottom:calc(env(safe-area-inset-bottom) + 26px);width:128px;height:128px;border-radius:50%;background:rgba(255,246,226,.32);border:3px solid rgba(138,90,58,.55);pointer-events:auto;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:#fff6e2;border:3px solid #8a5a3a;box-shadow:0 3px 0 #5e3a22}
#btnA{position:absolute;right:calc(env(safe-area-inset-right) + 26px);bottom:calc(env(safe-area-inset-bottom) + 44px);width:82px;height:82px;border-radius:50%;font-family:'Jua',sans-serif;font-size:32px;background:#ff9fb2;color:#fff;border:3px solid #b8566c;box-shadow:0 4px 0 #8f3d52;text-shadow:0 2px 0 #b8566c;pointer-events:auto;touch-action:none}
#btnA:active{transform:translateY(3px);box-shadow:0 1px 0 #8f3d52}
body.busy #touch{display:none}
#dialog{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 12px);width:min(740px,calc(100% - 20px));display:flex;gap:12px;padding:12px 14px 14px;z-index:20;min-height:120px;max-height:calc(100% - 24px);overflow:auto}
#portrait{width:92px;height:92px;image-rendering:pixelated;background:radial-gradient(circle at 50% 35%,#fff3e6,#f6d7bd);border:3px solid #8a5a3a;border-radius:12px;flex:none}
.dlgBody{flex:1;min-width:0}
#dlgName{font-family:'Jua',sans-serif;font-size:18px;color:#c0563a;margin-bottom:3px;min-height:4px}
#dlgText{font-size:17px;line-height:1.6;min-height:54px;white-space:pre-wrap;word-break:keep-all}
#dlgChoices{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.choice{text-align:left;padding:10px 12px;font-size:15px;background:#fffaf0;border:2px solid #d6b48a;border-radius:9px;line-height:1.35}
.choice.sel{background:#ffe1e8;border-color:#e0738c}
.choice:disabled{opacity:.45}
#dlgNext{position:absolute;right:16px;bottom:8px;color:#c0563a;font-size:14px;animation:bob 1s infinite}
@keyframes bob{50%{transform:translateY(3px)}}
#modal{position:fixed;inset:0;background:rgba(30,20,15,.5);display:flex;align-items:center;justify-content:center;z-index:30;padding:calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 14px)}
.modalBox{width:min(560px,100%);max-height:100%;display:flex;flex-direction:column}
.modalHead{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;font-family:'Jua',sans-serif;font-size:20px;border-bottom:2px dashed #d6b48a}
#modalClose{width:36px;height:36px;border-radius:9px;border:2px solid #8a5a3a;background:#fff;font-size:16px}
#modalBody{padding:12px 14px 14px;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:#fffaf0;border:2px solid #f0dcb8;margin-bottom:7px}
.row.sel{border-color:#e0738c;background:#ffeef2}
.row .ic{font-size:26px;width:34px;text-align:center;flex:none}
.row .nm{flex:1;min-width:0;font-size:15px}
.row .nm small{display:block;color:#9a7a62;font-size:12px;margin-top:1px}
.row.done{opacity:.55}
.sec{font-family:'Jua',sans-serif;font-size:15px;color:#9a6a42;margin:10px 0 6px}
.sec:first-child{margin-top:0}
.hearts{font-size:19px;letter-spacing:1px}
.note{font-size:13px;color:#8a6a52;line-height:1.55}
.relTop{display:flex;gap:12px;align-items:center;margin-bottom:8px}
.relTop canvas{width:92px;height:92px;image-rendering:pixelated;border:3px solid #8a5a3a;border-radius:12px;background:radial-gradient(circle at 50% 35%,#fff3e6,#f6d7bd);flex:none}
ul.ins{padding-left:18px;font-size:14px;line-height:1.7}
.empty{color:#a58a72;font-size:14px;padding:6px 2px}
#toasts{position:fixed;top:calc(env(safe-area-inset-top) + 112px);left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;z-index:25;pointer-events:none;width:92%}
.toast{background:#fff6e2;border:2px solid #8a5a3a;border-radius:20px;padding:6px 14px;font-family:'Jua',sans-serif;font-size:15px;box-shadow:0 3px 0 rgba(94,58,34,.5);animation:tin .25s ease-out;text-align:center}
.toast.q{background:#fff0b8;border-color:#c89a2a}
.toast.h{background:#ffe1e8;border-color:#e0738c}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}}
#fade{position:fixed;inset:0;background:#120c14;opacity:0;pointer-events:none;transition:opacity .6s;z-index:19}
#fade.on{opacity:1}
.screen{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top) + 20px) 16px calc(env(safe-area-inset-bottom) + 20px);overflow:auto;touch-action:pan-y;background:linear-gradient(#ffc9d6 0%,#ffe4cf 45%,#fff1d6 62%,#a9dc8f 62%,#8fcd78 100%)}
.petal{position:absolute;top:-20px;width:10px;height:8px;background:#ffb3c7;border-radius:60% 0 60% 0;animation:fall linear infinite;opacity:.85}
@keyframes fall{to{transform:translate(60px,110vh) rotate(540deg)}}
.logo{font-family:'Jua',sans-serif;text-align:center;color:#fff;text-shadow:0 3px 0 #c9577a,3px 0 0 #c9577a,-3px 0 0 #c9577a,0 -3px 0 #c9577a,0 6px 0 rgba(120,40,70,.3);line-height:1.1;position:relative;z-index:1}
.logo .s{font-size:22px;display:block;letter-spacing:3px}
.logo .b{font-size:clamp(40px,11vw,66px);display:block;margin-top:4px}
.ver{margin-top:10px;font-family:'Jua',sans-serif;color:#9a4a62;background:rgba(255,255,255,.7);padding:3px 12px;border-radius:20px;font-size:14px;position:relative;z-index:1}
#titleCouple{width:208px;height:160px;image-rendering:pixelated;margin:16px 0 10px;position:relative;z-index:1}
.titleBtns{display:flex;flex-direction:column;gap:12px;align-items:center;position:relative;z-index:1}
.titleBtns .btn{min-width:220px}
.hint{margin-top:18px;font-size:13px;color:#4f6b3f;text-align:center;line-height:1.6;position:relative;z-index:1}
.createBox{width:min(560px,100%);padding:18px 18px 20px;text-align:center}
.createBox h2{font-family:'Jua',sans-serif;font-size:24px;margin-bottom:12px}
.genders{display:flex;gap:12px;justify-content:center}
.gcard{flex:1;max-width:200px;padding:12px 8px 10px;border-radius:12px;border:3px solid #d6b48a;background:#fffaf0;display:flex;flex-direction:column;align-items:center;gap:6px}
.gcard canvas{width:72px;height:136px;image-rendering:pixelated}
.gcard b{font-family:'Jua',sans-serif;font-size:19px;font-weight:normal}
.gcard.sel{border-color:#e0738c;background:#ffe9ee;box-shadow:0 0 0 3px #ffc2cf}
#modeDesc{margin:12px 2px;font-size:14px;line-height:1.6;background:#fff;border-radius:10px;padding:10px 12px;border:2px dashed #e7c9a3;text-align:left;word-break:keep-all}
.field{display:flex;align-items:center;gap:10px;margin:10px 0;justify-content:center;font-family:'Jua',sans-serif}
.field input{font-family:'Gowun Dodum',sans-serif;font-size:17px;padding:8px 10px;border:2px solid #d6b48a;border-radius:9px;width:160px;background:#fff;color:#4a2f22}
.sw{display:flex;gap:8px}
.sw button{width:32px;height:32px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #d6b48a}
.sw button.sel{box-shadow:0 0 0 3px #e0738c}
#mg{position:fixed;inset:0;background:rgba(20,14,24,.55);display:flex;align-items:center;justify-content:center;z-index:33;padding:16px}
.mgBox{padding:12px 14px 16px;text-align:center;width:min(360px,100%)}
#mgTitle{font-family:'Jua',sans-serif;font-size:20px;margin-bottom:4px}
#mgHint{font-size:13px;color:#8a6a52;line-height:1.5;margin:6px 0 10px;word-break:keep-all}
#mgc{width:min(300px,100%);aspect-ratio:3/4;image-rendering:auto;border:3px solid #8a5a3a;border-radius:10px;background:#cfe9f7;touch-action:none;display:block;margin:0 auto}
#mgBtn{width:100%;margin-top:4px;touch-action:none}
#hudMini{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 170px);left:50%;transform:translateX(-50%);z-index:7;font-family:'Jua',sans-serif;font-size:20px;padding:6px 16px}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" class="hidden">
  <div id="clock" class="panel"><div id="dateText"></div><div class="t" id="timeText"></div><div class="g" id="goldText"></div><div id="relText"></div></div>
  <div id="topBtns">
    <button class="iconBtn" data-hud="quests" title="퀘스트">📜</button>
    <button class="iconBtn" data-hud="rel" title="관계">💗</button>
    <button class="iconBtn" data-hud="bag" title="가방">🎒</button>
    <button class="iconBtn" data-hud="sys" title="메뉴">⚙️</button>
  </div>
</div>
<div id="touch" class="hidden"><div id="joy"><div id="knob"></div></div><button id="btnA">A</button></div>
<div id="dialog" class="panel hidden">
  <canvas id="portrait" width="168" height="168"></canvas>
  <div class="dlgBody"><div id="dlgName"></div><div id="dlgText"></div><div id="dlgChoices"></div></div>
  <div id="dlgNext" class="hidden">▼</div>
</div>
<div id="modal" class="hidden"><div class="modalBox panel"><div class="modalHead"><span id="modalTitle"></span><button id="modalClose">✕</button></div><div id="modalBody"></div></div></div>
<div id="toasts"></div>
<div id="hudMini" class="panel hidden"></div>
<div id="mg" class="hidden"><div class="mgBox panel"><div id="mgTitle"></div><div id="mgHint"></div><canvas id="mgc" width="240" height="320"></canvas><button id="mgBtn" class="btn pink big">누르기</button></div></div>
<div id="fade"></div>

<div id="title" class="screen">
  <div class="logo"><span class="s">✿ 연애부터 결혼까지 ✿</span><span class="b">별빛마을<br>러브스토리</span></div>
  <span class="ver">2단계+ · 사계절 · 축제 · 새 지역</span>
  <canvas id="titleCouple" width="52" height="40"></canvas>
  <div class="titleBtns">
    <button class="btn big pink" id="btnNew">새로 시작하기</button>
    <button class="btn big hidden" id="btnCont">이어하기</button>
  </div>
  <p class="hint">PC: 방향키·WASD로 이동, Space·Enter로 행동<br>핸드폰: 왼쪽 조이스틱으로 이동, A 버튼으로 행동</p>
</div>

<div id="create" class="screen hidden">
  <div class="createBox panel">
    <h2>당신은 누구인가요?</h2>
    <div class="genders">
      <button class="gcard" data-g="m"><canvas width="18" height="34"></canvas><b>남자</b></button>
      <button class="gcard" data-g="f"><canvas width="18" height="34"></canvas><b>여자</b></button>
    </div>
    <p id="modeDesc"></p>
    <div class="field">이름 <input id="nameIn" maxlength="6" autocomplete="off"></div>
    <div class="field">머리색 <div class="sw" id="hairSw"></div></div>
    <div class="field">옷 색 <div class="sw" id="clothSw"></div></div>
    <div style="margin-top:14px;display:flex;gap:10px;justify-content:center">
      <button class="btn" id="btnBack">뒤로</button>
      <button class="btn big pink" id="btnStart">이 모습으로 시작!</button>
    </div>
  </div>
</div>

<script>
'use strict';
/* =================== 유틸 =================== */
const $=s=>document.querySelector(s);
const cv=$('#game'),ctx=cv.getContext('2d');
const T=16;
let DPR=1,SCALE=4,VW=0,VH=0;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function h2(x,y,s){let n=(x*374761393+y*668265263+(s||0)*982451653)|0;n=Math.imul(n^(n>>>13),1274126177);n^=n>>>16;return(n>>>0)/4294967296}
function shade(hex,amt){const n=parseInt(hex.slice(1),16);const r=clamp((n>>16)+amt,0,255),g=clamp(((n>>8)&255)+amt,0,255),b=clamp((n&255)+amt,0,255);return '#'+((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1)}
function josa(w,pair){const c=w.charCodeAt(w.length-1);const has=c>=0xAC00&&c<=0xD7A3&&(c-0xAC00)%28!==0;const [a,b]=pair.split('/');return w+(has?a:b)}
let CUR=null;
function curHero(){return HEROES[CUR||S.partner||HERO_IDS()[0]]}
function fmt(s){return s.replace(/\{(n|l)(?::([^}]+))?\}/g,(m,k,p)=>{const w=k==='n'?S.name:curHero().name;return p?josa(w,p):w})}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function shuffle(a,r){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor((r?r():Math.random())*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function resize(){DPR=Math.min(window.devicePixelRatio||1,3);cv.width=Math.floor(innerWidth*DPR);cv.height=Math.floor(innerHeight*DPR);cv.style.width=innerWidth+'px';cv.style.height=innerHeight+'px';SCALE=Math.max(2,Math.floor(Math.min(cv.width,cv.height)/(T*12)));VW=cv.width/SCALE;VH=cv.height/SCALE}
addEventListener('resize',resize);resize();
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
function outlineCanvas(c,col){
  const g=c.getContext('2d'),w=c.width,h=c.height,d=g.getImageData(0,0,w,h),a=d.data,o=new Uint8ClampedArray(a);
  const op=(x,y)=>x>=0&&y>=0&&x<w&&y<h&&a[(y*w+x)*4+3]>150;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=(y*w+x)*4;if(a[i+3]>40)continue;if(op(x-1,y)||op(x+1,y)||op(x,y-1)||op(x,y+1)){o[i]=col[0];o[i+1]=col[1];o[i+2]=col[2];o[i+3]=255}}
  d.data.set(o);g.putImageData(d,0,0);return c;
}
function circ(g,cx,cy,r,c){g.fillStyle=c;for(let dy=-r;dy<=r;dy++){const w=Math.floor(Math.sqrt(Math.max(0,r*r-dy*dy+r*0.6)));g.fillRect(Math.round(cx-w),Math.round(cy+dy),w*2+1,1)}}
function px(g,x,y,w,h,c){g.fillStyle=c;g.fillRect(x,y,w,h)}
const HEART=['.X.X.','XXXXX','XXXXX','.XXX.','..X..'];
function pheart(g,x,y,c,s){s=s||1;g.fillStyle=c;for(let r=0;r<5;r++)for(let k=0;k<5;k++)if(HEART[r][k]==='X')g.fillRect(x+k*s,y+r*s,s,s)}

/* =================== 아이템 =================== */
const ITEMS={
  wildflower:{name:'들꽃 다발',ic:'🌼',sell:20,desc:'들판에서 꺾은 소박한 꽃'},

  fish_mackerel:{name:'고등어',ic:'🐟',sell:40,desc:'은빛으로 반짝이는 고등어'},
  fish_bream:{name:'도미',ic:'🐠',sell:80,desc:'귀한 붉은 도미'},
  fish_tuna:{name:'참치',ic:'🐋',sell:200,desc:'거대한 참치! 대어다'},
  fish_gold:{name:'황금 물고기',ic:'✨',sell:500,desc:'전설로만 듣던 황금빛 물고기'},
  chocolate:{name:'수제 초콜릿',ic:'🍫',price:80,desc:'달콤한 선물의 정석'},

  lunchbox:{name:'정성 도시락',ic:'🍱',price:130,desc:'직접 싼 도시락 재료 세트'},
  pigment:{name:'수채화 물감',ic:'🎨',price:120,desc:'맑은 색이 나는 고급 물감'},

function bfsOn(m,sx,sy,tx,ty){

  while(qi<q.length){const c=q[qi++];if(c===goal)break;const cx=c%m.w,cy=(c/m.w)|0;for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=cx+dx,ny=cy+dy;if(nx<0||ny<0||nx>=m.w||ny>=m.h)continue;const k=ny*m.w+nx;if(prev[k]!==-1||SOLID.has(m.t[k]))continue;prev[k]=c;q.push(k)}}

}
function randomIn(m,r){for(let k=0;k<40;k++){const x=r[0]+Math.floor(Math.random()*(r[2]-r[0]+1)),y=r[1]+Math.floor(Math.random()*(r[3]-r[1]+1));if(!SOLID.has(mget(m,x,y)))return[x,y]}return[r[0],r[1]]}

    if(n.kind==='vill'&&!S.vmet[n.id]&&!isPaused()){ctx.font=`${fs*1.2}px sans-serif`;ctx.textAlign='center';ctx.fillText('❕',sx(n.x),sy(n.y-hh-8+Math.sin(animT*4)*1.5))}}
  if(target&&!isPaused())label(target.label,sx(target.x),sy(target.y)+Math.sin(animT*5)*DPR*2,fs,'rgba(255,255,255,.96)','#4a2f22');
}
let last=performance.now();
function loop(now){const dt=Math.min(0.05,(now-last)/1000);last=now;animT+=dt;if(state==='play'&&S&&CM){if(!isPaused())update(dt);render()}requestAnimationFrame(loop)}

/* =================== 타이틀 / 생성 =================== */
const titleC=$('#titleCouple'),titleG=titleC.getContext('2d');
function drawTitleCouple(){titleG.clearRect(0,0,52,40);titleG.imageSmoothingEnabled=false;const f=Math.floor(animT*2)%2;const m=charSprite(playerLook('m',HAIRS[1],CLOTHS[0]),'right',0,'happy',false),w=charSprite(playerLook('f',HAIRS[2],CLOTHS[3]),'left',0,'happy',false);titleG.drawImage(m,10,39-m.height-f);titleG.drawImage(w,26,39-w.height-(1-f));pheart(titleG,24,4+f,'#ff5c86')}
(function petals(){const t=$('#title');for(let i=0;i<14;i++){const p=document.createElement('div');p.className='petal';p.style.left=(Math.random()*100)+'%';p.style.animationDuration=(6+Math.random()*6)+'s';p.style.animationDelay=(-Math.random()*10)+'s';t.appendChild(p)}})();
let titleTimer=setInterval(()=>{animT+=0.25;drawTitleCouple()},250);drawTitleCouple();
const cre={g:'m',hair:0,cloth:0};
const MODE_DESC={m:'💐 <b>남자 모드</b> — 히로인 3명 중 한 명과 사랑을 키워 보세요.<br>🌷 <b>하린</b>(마을 꽃집): 섬세하고 다정해요. 작은 것을 기억해 주는 사람에게 끌려요.<br>🏄 <b>수아</b>(은빛 해변): 털털하고 활발해요. 솔직하고 함께 뛰어 주는 사람을 좋아해요.<br>🎨 <b>서윤</b>(솔바람 산): 조용한 화가예요. 천천히, 진심으로 다가오는 사람에게 마음을 열어요.',f:'💐 <b>여자 모드</b> — 공략 캐릭터 3명 중 한 명과 사랑을 키워 보세요.<br>☕ <b>도윤</b>(마을 카페): 무뚝뚝하지만 행동으로 마음을 보여 줘요.<br>🏄 <b>태오</b>(은빛 해변): 밝고 장난기 많은 서핑 강사. 인정해 주고 함께 놀아 주는 사람을 좋아해요.<br>📷 <b>준호</b>(솔바람 산): 다정한 사진작가. 추억과 기념일을 소중히 여겨요.'};
function renderCreate(){
  document.querySelectorAll('.gcard').forEach(c=>{c.classList.toggle('sel',c.dataset.g===cre.g);const g=c.querySelector('canvas').getContext('2d');g.clearRect(0,0,18,34);const spr=charSprite(playerLook(c.dataset.g,HAIRS[cre.hair],CLOTHS[cre.cloth]),'down',0,c.dataset.g===cre.g?'happy':'normal',false);g.drawImage(spr,0,34-spr.height)});
  $('#modeDesc').innerHTML=MODE_DESC[cre.g];
  $('#hairSw').innerHTML=HAIRS.map((c,i)=>`<button style="background:${c}" class="${i===cre.hair?'sel':''}" data-h="${i}"></button>`).join('');
  $('#clothSw').innerHTML=CLOTHS.map((c,i)=>`<button style="background:${c}" class="${i===cre.cloth?'sel':''}" data-c="${i}"></button>`).join('');
}
document.querySelectorAll('.gcard').forEach(c=>c.addEventListener('click',()=>{const prev=cre.g;cre.g=c.dataset.g;const ni=$('#nameIn');if(!ni.value||ni.value===(prev==='m'?'민준':'서연'))ni.value=cre.g==='m'?'민준':'서연';renderCreate()}));
$('#hairSw').addEventListener('click',e=>{const b=e.target.closest('[data-h]');if(b){cre.hair=+b.dataset.h;renderCreate()}});
$('#clothSw').addEventListener('click',e=>{const b=e.target.closest('[data-c]');if(b){cre.cloth=+b.dataset.c;renderCreate()}});
$('#btnNew').onclick=()=>{if(loadSave()&&!$('#btnNew').dataset.confirm){$('#btnNew').dataset.confirm=1;$('#btnNew').textContent='저장이 지워져요. 한 번 더 누르기';return}delete $('#btnNew').dataset.confirm;$('#btnNew').textContent='새로 시작하기';$('#title').classList.add('hidden');$('#create').classList.remove('hidden');$('#nameIn').value=cre.g==='m'?'민준':'서연';renderCreate()};
$('#btnBack').onclick=()=>{$('#create').classList.add('hidden');$('#title').classList.remove('hidden')};
$('#btnStart').onclick=()=>{const name=($('#nameIn').value||'').trim()||(cre.g==='m'?'민준':'서연');S=newState(cre.g,name.slice(0,6),playerLook(cre.g,HAIRS[cre.hair],CLOTHS[cre.cloth]));$('#create').classList.add('hidden');startGame(true)};
$('#btnCont').onclick=()=>{const s=loadSave();if(!s)return;S=migrate(s);$('#title').classList.add('hidden');startGame(false)};
function toTitle(){state='title';$('#hud').classList.add('hidden');$('#touch').classList.add('hidden');$('#hudMini').classList.add('hidden');MINI=null;$('#title').classList.remove('hidden');$('#btnCont').classList.toggle('hidden',!loadSave());updateBusy();titleTimer=setInterval(()=>{animT+=0.25;drawTitleCouple()},250)}
function startGame(isNew){
  clearInterval(titleTimer);buildAllMaps();S.visited=S.visited||{village:1};S.best=S.best||{};S.vmet=S.vmet||{};S.forageM=S.forageM||{};S.dayAff=S.dayAff||{};
  loadMap(MAPS[S.map]?S.map:'village');P.x=S.px;P.y=S.py;P.dir=S.dir||'down';P.pose=null;particles=[];timeAcc=0;sceneFx={};MINI=null;
  if(!S.forageM.beach||!S.forageM.onsen)spawnForage();if(!S.quests.qfe)S.quests.qfe='active';
  initNpcs();state='play';$('#hud').classList.remove('hidden');if(isTouch)$('#touch').classList.remove('hidden');hud();updateBusy();
  if(isNew)runScript(intro);else{toast(`🌸 다시 오신 걸 환영해요, ${S.name} 님`);updateQuests()}
}
async function intro(){
  $('#fade').classList.add('on');fading=true;await wait(200);
  await say(null,'도시의 회사 생활에 지쳐 가던 어느 날, {n:은/는} 한 통의 편지를 받았다.');
  await say(null,'"별빛마을의 작은 집을 너에게 남긴다. 그곳에서 너만의 행복을 찾으렴. — 할머니가"');
  await say(null,'그렇게 {n:은/는} 짐을 꾸려 별빛마을로 내려왔다.');
  await fadeTo(0);
  await say(GRANDMA,'아이고, 네가 그 집 손주구나! {n:이라고/라고}? 반갑다. 나는 잡화점 하는 복순 할머니란다.','happy');
  if(S.gender==='m')await say(GRANDMA,'우리 마을 근처엔 고운 아가씨들이 많단다. 꽃집 하린이는 섬세하고, 해변의 수아는 털털하고, 산 오두막의 서윤이는 조용하지. 호호, 잘해 보거라.','happy');
  else await say(GRANDMA,'우리 마을 근처엔 괜찮은 총각들이 많단다. 카페 도윤이는 무뚝뚝해도 속이 깊고, 해변의 태오는 밝고 씩씩하고, 산 오두막의 준호는 다정하지. 호호, 잘해 보거라.','happy');
  await say(GRANDMA,'동쪽 길로 가면 바다, 북쪽 길로 가면 산, 서쪽 길로 가면 온천이 나온단다. 계절마다 4일엔 축제도 열리지. 구경 많이 하거라.','normal');
  for(const id of HERO_IDS())if(!R(id).ins.includes('i0'))R(id).ins.push('i0');
  startQuest('q1');startQuest('qv');startQuest('qx');startQuest('qfe');
  setTimeout(()=>toast(isTouch?'🕹️ 조이스틱으로 이동, A 버튼으로 행동해요':'⌨️ 방향키·WASD로 이동, Space로 행동해요'),1200);save(true);
}
if(loadSave())$('#btnCont').classList.remove('hidden');
requestAnimationFrame(loop);

</script>
